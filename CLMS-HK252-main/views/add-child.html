<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Device - CLMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f7f6; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { width: 420px; background: #ffffff; border-radius: 12px; padding: 40px 30px; box-shadow: 0 8px 24px rgba(10, 37, 64, 0.08); text-align: center; }
        .icon-header { background: #e0e7ff; color: #635BFF; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; margin: 0 auto 20px; }
        h3 { color: #0A2540; margin-bottom: 8px; font-size: 22px; }
        p.subtitle { color: #425466; font-size: 14px; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 16px; text-align: left; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #635BFF; }
        input { width: 100%; padding: 14px 14px 14px 45px; border: 1px solid #e6e8eb; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; color: #0A2540; }
        input:focus { border-color: #635BFF; box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.1); }
        button { background: #635BFF; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; font-size: 15px; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #4a42e5; }
        .back-link { display: inline-block; margin-top: 25px; color: #425466; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .back-link:hover { color: #0A2540; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-header"><i class="fas fa-link"></i></div>
        <h3>Pair a Device</h3>
        <p class="subtitle">Connect your child's tracker to your account.</p>
        <form action="/parent/add-child" method="POST">
            <div class="input-group">
                <i class="fas fa-child"></i>
                <input type="text" name="childName" placeholder="Child's Name (e.g., Alex)" required>
            </div>
            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="tel" name="childPhone" placeholder="Child's Phone Number" required>
            </div>
            <div class="input-group">
                <i class="fas fa-microchip"></i>
                <input type="text" name="deviceId" placeholder="Device/Thing ID" required>
            </div>
            <button type="submit">Confirm Pairing</button>
        </form>
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</body>
</html>
